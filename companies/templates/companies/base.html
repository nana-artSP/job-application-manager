<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>求人応募管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      :root {
        --app-bg: #f5f7fb;
        --app-blue: #2563eb;
        --app-blue-dark: #123f6d;
        --app-blue-band: #0f3a6d;
        --app-blue-soft: #eaf1ff;
      }

      body {
        background: var(--app-bg);
        color: #172033;
      }

      .navbar {
        position: relative;
        z-index: 2;
      }

      .btn-primary {
        --bs-btn-bg: var(--app-blue);
        --bs-btn-border-color: var(--app-blue);
        --bs-btn-hover-bg: #1d4ed8;
        --bs-btn-hover-border-color: #1d4ed8;
      }

      .app-shell {
        position: relative;
      }

      .app-shell::before {
        background: linear-gradient(135deg, var(--app-blue-band), #1d5f9f);
        content: "";
        height: 230px;
        left: 0;
        position: absolute;
        right: 0;
        top: 0;
        z-index: 0;
      }

      .app-content {
        position: relative;
        z-index: 1;
      }

      .dashboard-card {
        border: 1px solid rgba(37, 99, 235, 0.10);
        border-radius: 8px;
      }

      .dashboard-card .count {
        color: var(--app-blue-dark);
        font-size: 1.85rem;
        font-weight: 700;
        line-height: 1;
      }

      .status-tabs {
        background: #eef4ff;
        border: 1px solid #dbe8ff;
        border-radius: 8px;
        padding: 4px;
      }

      .status-tabs .nav-link {
        border-radius: 6px;
        color: #365174;
        font-weight: 600;
      }

      .status-tabs .nav-link.active {
        background: #fff;
        color: var(--app-blue);
        box-shadow: 0 1px 3px rgba(15, 58, 109, 0.12);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container py-2 gap-3">
        <a class="navbar-brand fw-bold" href="{% url 'companies:list' %}">求人応募管理</a>
        <div class="ms-auto d-flex align-items-center gap-2">
          {% if user.is_authenticated %}
            <span class="text-secondary small">{{ user.username }}</span>
            <a class="btn btn-outline-primary" href="{% url 'companies:task_list' %}">タスク</a>
            <a class="btn btn-primary" href="{% url 'companies:create' %}">新規登録</a>
            <form method="post" action="{% url 'logout' %}">
              {% csrf_token %}
              <button class="btn btn-outline-secondary" type="submit">ログアウト</button>
            </form>
          {% else %}
            <a class="btn btn-outline-primary" href="{% url 'login' %}">ログイン</a>
            <a class="btn btn-primary" href="{% url 'companies:signup' %}">ユーザー登録</a>
          {% endif %}
        </div>
      </div>
    </nav>

    <div class="app-shell">
      <main class="container app-content py-4">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
