{% extends "companies/base.html" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-3">応募先を削除</h1>
          <p class="mb-4">
            <span class="fw-semibold">{{ object.name }}</span> を削除します。よろしいですか？
          </p>

          <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-end gap-2">
              <a class="btn btn-outline-secondary" href="{% url 'companies:list' %}">キャンセル</a>
              <button class="btn btn-danger" type="submit">削除</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
