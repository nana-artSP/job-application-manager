{% extends "companies/base.html" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-4">ログイン</h1>

          {% if form.errors %}
            <div class="alert alert-danger">ユーザー名またはパスワードが正しくありません。</div>
          {% endif %}

          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label fw-semibold" for="{{ form.username.id_for_label }}">ユーザー名</label>
              <input class="form-control" id="{{ form.username.id_for_label }}" name="{{ form.username.html_name }}" type="text" autocomplete="username" required>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold" for="{{ form.password.id_for_label }}">パスワード</label>
              <input class="form-control" id="{{ form.password.id_for_label }}" name="{{ form.password.html_name }}" type="password" autocomplete="current-password" required>
            </div>
            <div class="d-flex justify-content-between align-items-center gap-2">
              <a href="{% url 'companies:signup' %}">ユーザー登録</a>
              <button class="btn btn-primary" type="submit">ログイン</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
