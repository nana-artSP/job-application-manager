{% extends "companies/base.html" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h1 class="h4 mb-4">ユーザー登録</h1>

          <form method="post" novalidate>
            {% csrf_token %}

            {% for field in form %}
              <div class="mb-3">
                <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
                <input
                  class="form-control"
                  id="{{ field.id_for_label }}"
                  name="{{ field.html_name }}"
                  type="{% if 'password' in field.name %}password{% else %}text{% endif %}"
                  autocomplete="{% if field.name == 'username' %}username{% else %}new-password{% endif %}"
                  required
                >
                {% if field.help_text %}
                  <div class="form-text">{{ field.help_text }}</div>
                {% endif %}
                {% if field.errors %}
                  <div class="invalid-feedback d-block">{{ field.errors|striptags }}</div>
                {% endif %}
              </div>
            {% endfor %}

            <div class="d-flex justify-content-between align-items-center gap-2 mt-4">
              <a href="{% url 'login' %}">ログインへ戻る</a>
              <button class="btn btn-primary" type="submit">登録する</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
